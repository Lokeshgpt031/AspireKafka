<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Welcome to the Home Page</h1>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
      <i class="bi bi-plus"></i> Add Product
    </button>
  </div>
  <p>Here you can browse products to buy.</p>

  <h2>Products</h2>
  <div class="row">
    <div *ngFor="let product of products" class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="card-text">Price: {{ product.price | currency }}</p>
          <p class="card-text">Available: {{ product.quantity }}</p>
          <div class="form-group">
            <label for="quantity-{{product.id}}">Quantity:</label>
            <input
            type="text" 
              class="form-control" 
              id="customer-{{customerName}}-{{product.id}}" 
              placeholder="Enter Name" 
              [(ngModel)]="customerName[product.id]"
              (ngModelChange)="customerName[product.id] = $event"
            />
            <input 
              type="number" 
              class="form-control" 
              id="quantity-{{product.id}}" 
              min="1" 
              max="{{product.quantity}}" 
              [(ngModel)]="purchaseQuantities[product.id]">
          </div>
          <button 
            class="btn btn-primary mt-2" 
            [disabled]="!purchaseQuantities[product.id] || purchaseQuantities[product.id] < 1 || purchaseQuantities[product.id] > product.quantity || !customerName[product.id]"
            (click)="buyProduct(product.id, purchaseQuantities[product.id], customerName[product.id])">
            Buy
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addProductModalLabel">Add New Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="productName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName" [(ngModel)]="newProduct.name" name="productName" required>
          </div>
          <div class="mb-3">
            <label for="productPrice" class="form-label">Price</label>
            <input type="number" class="form-control" id="productPrice" [(ngModel)]="newProduct.price" name="productPrice" min="0.01" step="0.01" required>
          </div>
          <div class="mb-3">
            <label for="productQuantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="productQuantity" [(ngModel)]="newProduct.quantity" name="productQuantity" min="1" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="addProduct()" [disabled]="!isProductValid()">Add Product</button>
      </div>
    </div>
  </div>
</div>
